name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name EatNotifier main.py

      - name: Upload (Actions 탭에서 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: EatNotifier
          path: dist/EatNotifier.exe

      - name: Release (태그 push 시 Releases에 업로드)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EatNotifier.exe
